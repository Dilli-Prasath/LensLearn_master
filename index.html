<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="LensLearn - Point your lens at any textbook page and get step-by-step explanations in your language. Powered by Gemma 4, works offline." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>LensLearn - Point your lens. Learn anything.</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Auto-recover from stale deploys: if a JS chunk fails to load
      // (MIME type error or network error), unregister the service worker
      // and reload once so the browser fetches fresh assets.
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('MIME type') || e.message.includes('Failed to fetch dynamically imported module'))) {
          if (!sessionStorage.getItem('sw_reload')) {
            sessionStorage.setItem('sw_reload', '1');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
                caches.keys().then(function(names) {
                  names.forEach(function(n) { caches.delete(n); });
                  window.location.reload();
                });
              });
            } else {
              window.location.reload();
            }
          } else {
            sessionStorage.removeItem('sw_reload');
          }
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
